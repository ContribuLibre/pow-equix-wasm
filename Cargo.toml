# Preuve de travail Equi-X pour le web, à mémoire réglable.
#
# `pow-equix` porte le format du défi, la résolution et la vérification
# d’Equihash(n, 3) sur HashX (n = 60 : Equi-X) ; il se réutilise tel quel en
# natif (application Tauri, serveur Rust), avec le compilateur HashX.
# `pow-equix-wasm` l’expose au navigateur, aux Web Workers et aux serveurs
# JavaScript par une interface C minimale, sans wasm-bindgen. `crates/hashx`
# est une copie de hashx 0.9.1 (Arti) qui expose le programme généré.
[workspace]
resolver = "3"
members = ["crates/hashx", "crates/pow-equix", "crates/pow-equix-wasm"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.91"
# Equi-X et HashX (projet Arti de Tor) sont sous LGPL-3.0-only.
license = "LGPL-3.0-only"
repository = "https://github.com/ContribuLibre/pow-equix-wasm"
publish = false

# Les tests résolvent des centaines de défis : optimisés, ils restent courts.
[profile.test]
opt-level = 3

[profile.release]
# Le solveur boucle sur l’interpréteur HashX : la vitesse prime sur la taille.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
